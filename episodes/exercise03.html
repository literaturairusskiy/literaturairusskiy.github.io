<script>
function renderMultipleChoice(containerId, questions, prefix) {
  const container = document.getElementById(containerId);

  questions.forEach((q, index) => {
    const block = document.createElement("div");
    block.className = "question";

    const prompt = document.createElement("p");
    prompt.className = "prompt";
    prompt.textContent = q.q;
    block.appendChild(prompt);

    const options = document.createElement("div");
    options.className = "options";

    q.options.forEach((option, j) => {
      const label = document.createElement("label");
      label.className = "option";

      const radio = document.createElement("input");
      radio.type = "radio";
      radio.name = prefix + index;
      radio.value = j;

      const text = document.createElement("span");
      text.textContent =
        String.fromCharCode(1072 + j) + ") " + option;

      label.appendChild(radio);
      label.appendChild(text);
      options.appendChild(label);
    });

    block.appendChild(options);
    container.appendChild(block);
  });
}

function checkQuiz(questions, prefix, resultId) {
  let score = 0;

  questions.forEach((q, index) => {
    const selected = document.querySelector(
      'input[name="' + prefix + index + '"]:checked'
    );

    if (selected && Number(selected.value) === q.answer) {
      score++;
    }
  });

  document.getElementById(resultId).textContent =
    "Результат: " + score + " из " + questions.length;
}

function resetQuiz(containerId, resultId) {
  document.querySelectorAll(
    "#" + containerId + ' input[type="radio"]'
  ).forEach(input => {
    input.checked = false;
  });

  document.getElementById(resultId).textContent = "";
}
