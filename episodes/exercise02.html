```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЛЕКСИКА И ГРАММАТИКА</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 24px 16px 40px;
  background: #f4f3e8;
  color: #292923;
  font-family: Arial, Helvetica, sans-serif;
  line-height: 1.6;
}

main {
  max-width: 850px;
  margin: 0 auto;
}

h1 {
  font-size: clamp(25px, 4vw, 34px);
  line-height: 1.25;
  margin: 0 0 28px;
  letter-spacing: 0.03em;
}

h2 {
  font-size: 20px;
  margin: 0 0 22px;
}

.section {
  background: #fffef9;
  border: 1px solid #d9d7c8;
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 24px;
}

.question {
  padding-bottom: 18px;
  margin-bottom: 18px;
  border-bottom: 1px solid #e9e7dc;
}

.question:last-child {
  border-bottom: none;
  margin-bottom: 0;
}

.question p {
  margin: 0 0 10px;
  font-weight: 600;
}

.options {
  display: grid;
  gap: 7px;
}

.option {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 8px;
  cursor: pointer;
}

.option:hover {
  background: #f4f3e8;
}

input[type="radio"] {
  margin-top: 6px;
  accent-color: #536b59;
}

.match-head,
.match-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.match-head {
  margin-bottom: 8px;
  color: #68685f;
  font-size: 14px;
  font-weight: bold;
}

.match-row {
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid #e9e7dc;
}

.match-row:last-child {
  border-bottom: none;
}

.verb {
  font-weight: 600;
}

select {
  width: 100%;
  min-width: 0;
  padding: 10px;
  border: 1px solid #d9d7c8;
  border-radius: 8px;
  background: white;
  color: #292923;
  font: inherit;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 22px;
}

button {
  padding: 11px 20px;
  border: none;
  border-radius: 30px;
  background: #536b59;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: 0.88;
}

button.secondary {
  background: #e7ece3;
  color: #292923;
}

.result {
  margin: 16px 0 0;
  font-weight: bold;
  color: #536b59;
}

@media (max-width: 520px) {
  body {
    padding: 18px 10px 30px;
  }

  .section {
    padding: 17px;
  }

  .match-head,
  .match-row {
    grid-template-columns: 1fr;
    gap: 6px;
  }

  .match-head span:last-child {
    display: none;
  }

  .match-row {
    padding: 13px 0;
  }
}
</style>
</head>

<body>
<main>

<h1>ЛЕКСИКА И ГРАММАТИКА</h1>

<section class="section">
<h2>Упражнение 1. Выберите подходящий вариант</h2>
<div id="questions"></div>

<div class="actions">
  <button type="button" onclick="checkAnswers()">
    Проверить
  </button>
  <button type="button" class="secondary" onclick="resetAnswers()">
    Сбросить
  </button>
</div>

<p class="result" id="result1" aria-live="polite"></p>
</section>

<section class="section">
<h2>Упражнение 2. Подберите пару НСВ — СВ</h2>

<div class="match-head">
  <span>Несовершенный вид (НСВ)</span>
  <span>Совершенный вид (СВ)</span>
</div>

<div id="matching"></div>

<div class="actions">
  <button type="button" onclick="checkMatching()">
    Проверить
  </button>
  <button type="button" class="secondary" onclick="resetMatching()">
    Сбросить
  </button>
</div>

<p class="result" id="result2" aria-live="polite"></p>
</section>

</main>

<script>
const questions = [
  {
    q: "1. Каждое утро я ___ в семь часов.",
    options: ["встаю", "ложусь", "просыпаюсь"],
    answer: 0
  },
  {
    q: "2. Вчера я очень устал, поэтому решил пораньше ___.",
    options: ["вставать", "лечь", "проснуться"],
    answer: 1
  },
  {
    q: "3. По выходным мы любим ___ у себя дома.",
    options: ["принимать гостей", "принимать участие", "знакомиться"],
    answer: 0
  },
  {
    q: "4. Моя коллега хочет ___ в конференции.",
    options: ["принять гостей", "принять участие", "встретиться"],
    answer: 1
  },
  {
    q: "5. Я обычно ___ тепло осенью.",
    options: ["одеваюсь", "умываюсь", "просыпаюсь"],
    answer: 0
  },
  {
    q: "6. Мы договорились ___ у входа в музей в шесть.",
    options: ["познакомиться", "встретиться", "поссориться"],
    answer: 1
  },
  {
    q: "7. Они давно не виделись и крепко ___.",
    options: ["ссорились", "обнялись", "оделись"],
    answer: 1
  },
  {
    q: "8. Мы иногда ___, но потом всегда ___.",
    options: [
      "ссоримся … миримся",
      "встречаемся … знакомимся",
      "просыпаемся … встаём"
    ],
    answer: 0
  },
  {
    q: "9. Перед сном я ___ и чищу зубы.",
    options: ["умываюсь", "одеваюсь", "собираюсь"],
    answer: 0
  },
  {
    q: "10. На вечеринке я хочу ___ с новыми людьми.",
    options: ["познакомиться", "поссориться", "обняться"],
    answer: 0
  },
  {
    q: "11. Обычно я ___ в одиннадцать вечера.",
    options: ["просыпаюсь", "ложусь", "встаю"],
    answer: 1
  },
  {
    q: "12. Я уже ___ и теперь могу завтракать.",
    options: ["проснулся", "лёг", "оделся"],
    answer: 0
  }
];

const questionsContainer = document.getElementById("questions");

questions.forEach((item, index) => {
  const block = document.createElement("div");
  block.className = "question";

  const prompt = document.createElement("p");
  prompt.textContent = item.q;
  block.appendChild(prompt);

  const options = document.createElement("div");
  options.className = "options";

  item.options.forEach((option, optionIndex) => {
    const label = document.createElement("label");
    label.className = "option";

    const radio = document.createElement("input");
    radio.type = "radio";
    radio.name = "question" + index;
    radio.value = optionIndex;

    const text = document.createElement("span");
    text.textContent =
      String.fromCharCode(1072 + optionIndex) + ") " + option;

    label.appendChild(radio);
    label.appendChild(text);
    options.appendChild(label);
  });

  block.appendChild(options);
  questionsContainer.appendChild(block);
});

function checkAnswers() {
  let score = 0;

  questions.forEach((question, index) => {
    const selected = document.querySelector(
      'input[name="question' + index + '"]:checked'
    );

    if (selected && Number(selected.value) === question.answer) {
      score++;
    }
  });

  document.getElementById("result1").textContent =
    "Результат: " + score + " из " + questions.length;
}

function resetAnswers() {
  document.querySelectorAll(
    '#questions input[type="radio"]'
  ).forEach(input => {
    input.checked = false;
  });

  document.getElementById("result1").textContent = "";
}

const pairs = [
  ["принимать гостей", "принять гостей"],
  ["принимать участие", "принять участие"],
  ["вставать", "встать"],
  ["просыпаться", "проснуться"],
  ["ложиться", "лечь"],
  ["одеваться", "одеться"],
  ["собираться", "собраться"],
  ["умываться", "умыться"],
  ["знакомиться", "познакомиться"],
  ["встречаться", "встретиться"],
  ["обниматься", "обняться"],
  ["ссориться", "поссориться"],
  ["мириться", "помириться"]
];

const matchingContainer = document.getElementById("matching");
const perfectives = pairs.map(pair => pair[1]);

// Перемешиваем варианты совершенного вида.
for (let i = perfectives.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  [perfectives[i], perfectives[j]] =
    [perfectives[j], perfectives[i]];
}

pairs.forEach((pair, index) => {
  const row = document.createElement("div");
  row.className = "match-row";

  const verb = document.createElement("div");
  verb.className = "verb";
  verb.textContent = pair[0];

  const select = document.createElement("select");
  select.setAttribute(
    "aria-label",
    "Совершенный вид для глагола " + pair[0]
  );
  select.dataset.answer = pair[1];

  const placeholder = document.createElement("option");
  placeholder.value = "";
  placeholder.textContent = "Выберите вариант";
  select.appendChild(placeholder);

  perfectives.forEach(perfective => {
    const option = document.createElement("option");
    option.value = perfective;
    option.textContent = perfective;
    select.appendChild(option);
  });

  row.appendChild(verb);
  row.appendChild(select);
  matchingContainer.appendChild(row);
});

function checkMatching() {
  let score = 0;
  const selects = matchingContainer.querySelectorAll("select");

  selects.forEach(select => {
    if (select.value === select.dataset.answer) {
      score++;
    }
  });

  document.getElementById("result2").textContent =
    "Результат: " + score + " из " + pairs.length;
}

function resetMatching() {
  matchingContainer.querySelectorAll("select").forEach(select => {
    select.value = "";
  });

  document.getElementById("result2").textContent = "";
}
</script>

</body>
</html>
```
